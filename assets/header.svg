<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#dbe1ea"/>
      <stop offset="0.52" stop-color="#7d8798"/>
      <stop offset="0.62" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#99a3b4"/>
    </linearGradient>
    <linearGradient id="marvelRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f22530"/>
      <stop offset="0.5" stop-color="#c11119"/>
      <stop offset="1" stop-color="#7d0a10"/>
    </linearGradient>
    <linearGradient id="flareGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#000000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" fill="#050505"/>

  <!-- phase 1: comic pages flipping -->
  
  <g opacity="0">
    <rect x="30" y="18" width="170" height="130" fill="#b91c1c"/>
    <rect x="30" y="168" width="170" height="130" fill="#b91c1c" opacity="0.75"/>
    <animate attributeName="opacity" values="0;0.85;0.1;0.9;0.15;0.8;0" keyTimes="0;0.18;0.36;0.52;0.7;0.86;1" dur="1.7s" begin="0.00s" fill="freeze"/>
  </g>
  <g opacity="0">
    <rect x="215" y="18" width="170" height="130" fill="#0e7490"/>
    <rect x="215" y="168" width="170" height="130" fill="#0e7490" opacity="0.75"/>
    <animate attributeName="opacity" values="0;0.85;0.1;0.9;0.15;0.8;0" keyTimes="0;0.18;0.36;0.52;0.7;0.86;1" dur="1.7s" begin="0.08s" fill="freeze"/>
  </g>
  <g opacity="0">
    <rect x="400" y="18" width="170" height="130" fill="#a16207"/>
    <rect x="400" y="168" width="170" height="130" fill="#a16207" opacity="0.75"/>
    <animate attributeName="opacity" values="0;0.85;0.1;0.9;0.15;0.8;0" keyTimes="0;0.18;0.36;0.52;0.7;0.86;1" dur="1.7s" begin="0.16s" fill="freeze"/>
  </g>
  <g opacity="0">
    <rect x="585" y="18" width="170" height="130" fill="#6d28d9"/>
    <rect x="585" y="168" width="170" height="130" fill="#6d28d9" opacity="0.75"/>
    <animate attributeName="opacity" values="0;0.85;0.1;0.9;0.15;0.8;0" keyTimes="0;0.18;0.36;0.52;0.7;0.86;1" dur="1.7s" begin="0.24s" fill="freeze"/>
  </g>
  <g opacity="0">
    <rect x="770" y="18" width="170" height="130" fill="#be185d"/>
    <rect x="770" y="168" width="170" height="130" fill="#be185d" opacity="0.75"/>
    <animate attributeName="opacity" values="0;0.85;0.1;0.9;0.15;0.8;0" keyTimes="0;0.18;0.36;0.52;0.7;0.86;1" dur="1.7s" begin="0.32s" fill="freeze"/>
  </g>
  <g>
    <rect x="0" y="18" width="1000" height="130" fill="url(#dots)"/>
    <rect x="0" y="168" width="1000" height="130" fill="url(#dots)"/>
    <animate attributeName="opacity" values="0.5;0.15;0.55;0.1;0.5;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="1.8s" begin="0s" fill="freeze"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" opacity="0">
    <line x1="-80" y1="300" x2="240" y2="30"/>
    <line x1="1080" y1="270" x2="760" y2="10"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="0.5s" begin="0.35s" fill="freeze"/>
  </g>

  <!-- cinematic slow push-in after the intro lands -->
  <g transform="translate(500 160)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.045" dur="7s" begin="2.8s" repeatCount="indefinite"/>
      <g transform="translate(-500 -160)">

        <!-- the red band snaps in -->
        <g transform="translate(500 148)">
          <rect x="-415" y="-80" width="830" height="160" fill="url(#marvelRed)" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.95s" fill="freeze"/>
            <animateTransform attributeName="transform" type="scale" values="0.55 1;1.06 1;1 1" keyTimes="0;0.65;1" dur="0.4s" begin="1.95s" fill="freeze"/>
          </rect>
          <rect x="-415" y="-80" width="830" height="160" fill="none" stroke="#ffd9db" stroke-opacity="0.5" stroke-width="2" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
          </rect>
        </g>

        <!-- name -->
        <g font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-size="86" font-weight="900" text-anchor="middle">
          
    <g transform="translate(130 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">P
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="1.50s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="1.45s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">P
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.45s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(222 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.15s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">R
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="1.65s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="1.60s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">R
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.60s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(315 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.30s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">I
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="1.80s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="1.75s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">I
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.75s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(407 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">Y
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="1.95s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="1.90s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">Y
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.90s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(500 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.60s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">A
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="2.10s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="2.05s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">A
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.05s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(592 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.75s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">N
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="2.25s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="2.20s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">N
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.20s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(685 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="0.90s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">S
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="2.40s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="2.35s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">S
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.35s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(777 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="1.05s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">H
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="2.55s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="2.50s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">H
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.50s" fill="freeze"/>
        </text>
      </g>
    </g>
    <g transform="translate(870 148)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="3.1" to="1" dur="0.6s" begin="1.20s" fill="freeze"/>
        <text y="6" opacity="1" fill="#ed1d24">U
          <animate attributeName="fill" values="#ed1d24;#f5c518;#2dd4bf;#a78bfa;#f97316;#58a6ff;#ed1d24;#f5c518" dur="2.70s" begin="0s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0" dur="0.2s" begin="2.65s" fill="freeze"/>
        </text>
        <text y="6" opacity="0" fill="url(#metal)" stroke="#454e5e" stroke-width="1">U
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.65s" fill="freeze"/>
        </text>
      </g>
    </g>
        </g>

        <!-- lens flare on lock-in, then a softer sweep every few seconds -->
        <rect x="-60" y="140" width="1120" height="5" fill="url(#flareGrad)" opacity="0">
          <animate attributeName="opacity" values="0;1;0" dur="0.55s" begin="2.3s" fill="freeze"/>
        </rect>
        <g opacity="0">
          <rect x="-80" y="30" width="190" height="260" fill="url(#flareGrad)" transform="skewX(-16)"/>
          <animate attributeName="opacity" values="0;0.5;0" dur="1.1s" begin="4.5s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;1250 0" dur="9s" begin="4.5s" repeatCount="indefinite"/>
        </g>

        <!-- languages -->
        <text x="500" y="284" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="7" fill="url(#metal)" opacity="0">PYTHON · JAVA · DJANGO · SQL · JAVASCRIPT
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.55s" fill="freeze"/>
        </text>
      </g>
    </g>
  </g>
</svg>
