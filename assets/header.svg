<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#58a6ff;#f778ba;#2dd4bf;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#f778ba;#2dd4bf;#a78bfa;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f778ba">
        <animate attributeName="stop-color" values="#f778ba;#2dd4bf;#a78bfa;#58a6ff;#f778ba" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neb1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.5"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb3"><stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="panelClip"><rect x="55" y="42" width="890" height="236" rx="30"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1000" height="320" fill="#0a0e16"/>
  <g filter="url(#blur)">
    <circle cx="190" cy="90" r="130" fill="url(#neb1)">
      <animate attributeName="cx" values="190;260;190" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;130;90" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="70" r="120" fill="url(#neb2)">
      <animate attributeName="cx" values="820;740;820" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="290" r="140" fill="url(#neb3)">
      <animate attributeName="cx" values="520;450;520" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- twinkling dust -->
  <g fill="#ffffff">
    <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="280" r="1.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="45" r="2.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="295" r="1.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="250" r="2"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="35" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1.7"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="120" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glass panel -->
  <rect x="55" y="42" width="890" height="236" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="75" y="52" width="850" height="2.5" rx="1" fill="#ffffff" opacity="0.35"/>

  <!-- flying objects (marvel-intro energy) -->
  <g font-family="monospace" font-weight="bold">
    <text font-size="30" fill="#58a6ff" opacity="0">&lt;/&gt;
      <animateMotion path="M -60 300 L 1080 40" dur="9s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text font-size="24" fill="#f778ba" opacity="0">{ }
      <animateMotion path="M 1080 270 L -60 90" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.12;0.85;1" dur="11s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text font-size="26" fill="#2dd4bf" opacity="0">#
      <animateMotion path="M -40 90 L 1060 300" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.12;0.85;1" dur="10s" begin="4s" repeatCount="indefinite"/>
    </text>
    <text font-size="22" fill="#a78bfa" opacity="0">λ
      <animateMotion path="M 200 -40 L 760 350" dur="8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text font-size="20" fill="#fbbf24" opacity="0">*
      <animateMotion path="M 850 -30 L 240 340" dur="12s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <circle r="4" fill="#58a6ff" opacity="0">
      <animateMotion path="M -30 170 L 1050 150" dur="6.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="6.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#f778ba" opacity="0">
      <animateMotion path="M 1040 210 L -30 120" dur="7.5s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="7.5s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name: letters slam in, marvel style -->
  <g font-family="'Arial Black', 'Segoe UI', Arial, sans-serif" font-size="88" font-weight="900" fill="url(#aurora)" text-anchor="middle">
    <text x="212" y="168">P<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.05s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-260 -140" to="0 0" dur="0.55s" begin="0.05s" fill="freeze"/></text>
    <text x="278" y="168">R<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.15s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="180 -190" to="0 0" dur="0.55s" begin="0.15s" fill="freeze"/></text>
    <text x="342" y="168">I<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.25s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-60 210" to="0 0" dur="0.55s" begin="0.25s" fill="freeze"/></text>
    <text x="388" y="168">Y<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="300 90" to="0 0" dur="0.55s" begin="0.35s" fill="freeze"/></text>
    <text x="452" y="168">A<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-320 40" to="0 0" dur="0.55s" begin="0.45s" fill="freeze"/></text>
    <text x="518" y="168">N<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.55s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="90 -220" to="0 0" dur="0.55s" begin="0.55s" fill="freeze"/></text>
    <text x="586" y="168">S<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.65s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-140 200" to="0 0" dur="0.55s" begin="0.65s" fill="freeze"/></text>
    <text x="650" y="168">H<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.75s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="330 -80" to="0 0" dur="0.55s" begin="0.75s" fill="freeze"/></text>
    <text x="716" y="168">U<animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.85s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-40 -240" to="0 0" dur="0.55s" begin="0.85s" fill="freeze"/></text>
  </g>

  <!-- language chips, frosted glass -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.15s" fill="freeze"/>
      <rect x="216" y="202" width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="272" y="226" fill="#c4b5fd">PYTHON</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
      <rect x="340" y="202" width="84" height="36" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#58a6ff" stroke-opacity="0.6"/>
      <text x="382" y="226" fill="#93c5fd">JAVA</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.45s" fill="freeze"/>
      <rect x="436" y="202" width="108" height="36" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="490" y="226" fill="#5eead4">DJANGO</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
      <rect x="556" y="202" width="72" height="36" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#f778ba" stroke-opacity="0.6"/>
      <text x="592" y="226" fill="#f9a8d4">SQL</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.75s" fill="freeze"/>
      <rect x="640" y="202" width="144" height="36" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="712" y="226" fill="#fcd34d">JAVASCRIPT</text></g>
  </g>

  <!-- glass shine sweep -->
  <g clip-path="url(#panelClip)">
    <rect x="0" y="20" width="220" height="290" fill="url(#shine)" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="-560 0;1250 0;1250 0" keyTimes="0;0.32;1" dur="6s" begin="2.2s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
</svg>
